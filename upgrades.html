<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店務升級｜開工吧！社畜人生</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>body{font-family:'Noto Sans TC',sans-serif}</style>
</head>
<body class="min-h-screen bg-stone-900 text-stone-100 p-5 sm:p-8">
    <main class="mx-auto max-w-5xl">
        <a href="index.html" class="inline-flex items-center gap-2 rounded-lg border border-stone-700 bg-stone-800 px-3 py-2 text-sm font-bold text-stone-200 hover:bg-stone-700">← 回到收銀台</a>
        <header class="my-5 rounded-3xl border border-emerald-700/60 bg-gradient-to-br from-emerald-950 to-stone-800 p-6 shadow-2xl">
            <p class="text-xs font-black uppercase tracking-[0.25em] text-emerald-300">PART 2 · STORE MANAGEMENT</p>
            <div class="mt-2 flex flex-wrap items-end justify-between gap-4">
                <div><h1 class="text-2xl font-black text-emerald-100">📈 店務升級</h1><p class="mt-2 text-sm text-stone-300">把營業額投資在服務和熟客經營，讓小店越做越順手。</p></div>
                <div class="rounded-2xl border border-emerald-800 bg-stone-950/70 px-5 py-3 text-right"><span class="block text-xs text-stone-400">可用營業額</span><strong id="funds" class="text-2xl font-black text-emerald-300">$0</strong></div>
            </div>
        </header>
        <p id="notice" class="mb-4 min-h-6 text-sm font-bold text-emerald-300" aria-live="polite"></p>
        <section id="upgrade-list" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3" aria-label="升級項目"></section>
    </main>
    <script src="game-data.js"></script>
    <script>
        let funds = Number(localStorage.getItem('cashierRevenue') || 0);
        const owned = new Set(JSON.parse(localStorage.getItem('restaurantUpgrades') || '[]'));
        const money = amount => '$' + amount.toLocaleString('zh-TW');
        function render() {
            document.getElementById('funds').textContent = money(funds);
            const list = document.getElementById('upgrade-list');
            list.innerHTML = '';
            window.restaurantUpgrades.forEach(item => {
                const bought = owned.has(item.id);
                const card = document.createElement('article');
                card.className = 'flex min-h-44 flex-col rounded-2xl border border-stone-700 bg-stone-800 p-5 shadow-lg';
                card.innerHTML = `<div class="flex items-start gap-3"><span class="text-4xl">${item.emoji}</span><div><h2 class="font-black text-stone-100">${item.name}</h2><p class="mt-1 text-xs leading-relaxed text-stone-400">${item.detail}</p></div></div><div class="mt-auto flex items-center justify-between pt-5"><strong class="text-emerald-300">${money(item.price)}</strong><button class="buy rounded-lg px-3 py-2 text-xs font-black ${bought ? 'bg-emerald-950 text-emerald-300' : funds >= item.price ? 'bg-emerald-600 text-white hover:bg-emerald-500' : 'bg-stone-700 text-stone-500'}" data-id="${item.id}" ${bought || funds < item.price ? 'disabled' : ''}>${bought ? '已購入 ✓' : '購入升級'}</button></div>`;
                list.appendChild(card);
            });
            list.querySelectorAll('.buy').forEach(button => button.addEventListener('click', () => buy(button.dataset.id)));
        }
        function buy(id) {
            const item = window.restaurantUpgrades.find(entry => entry.id === id);
            if (!item || owned.has(id) || funds < item.price) return;
            funds -= item.price;
            owned.add(id);
            localStorage.setItem('cashierRevenue', String(funds));
            localStorage.setItem('restaurantUpgrades', JSON.stringify([...owned]));
            document.getElementById('notice').textContent = `${item.emoji} 已購入「${item.name}」！回到收銀台後即可使用。`;
            render();
        }
        render();
    </script>
</body>
</html>
